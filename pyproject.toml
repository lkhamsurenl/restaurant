[project]
name = "placemat"
version = "0.1.0"
description = "Track the restaurants you loved and get recommendations grounded in real nearby venues"
# 3.11, not 3.10: StrEnum landed in 3.11. The system default here is 3.9.
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
    "httpx",
    "jinja2",
    "click",
]

[project.scripts]
eats = "placemat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["placemat"]
